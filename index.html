<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Froggy Grammar Pond - It's vs They're</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b291e;
            font-family: 'Fredoka', sans-serif;
        }

        /* Aspect-ratio locked stage so signposts on pond.jpg align accurately across screens */
        #viewport-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #184d38 0%, #071912 100%);
            overflow: hidden;
        }

        #game-stage {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 177.78vh; /* 16:9 ratio lock when height-constrained */
            max-height: 56.25vw; /* 16:9 ratio lock when width-constrained */
            aspect-ratio: 16 / 9;
            background-image: url('pond.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.85);
            overflow: hidden;
            border-radius: 12px;
        }

        /* Fallback if screen is very tall/narrow mobile portrait: fill height still nicely */
        @media (max-aspect-ratio: 4/3) {
            #game-stage {
                max-height: 100vh;
                max-width: 100vw;
                aspect-ratio: auto;
                background-size: 100% 100%;
                border-radius: 0;
            }
        }

        /* Ambient fireflies */
        .firefly {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff9c4 0%, #ffd54f 50%, transparent 100%);
            box-shadow: 0 0 12px 4px rgba(255, 235, 59, 0.75);
            pointer-events: none;
            animation: floatFirefly 6s ease-in-out infinite alternate;
            z-index: 5;
        }

        @keyframes floatFirefly {
            0% { transform: translate(0, 0) scale(0.8); opacity: 0.4; }
            50% { transform: translate(20px, -25px) scale(1.2); opacity: 1; }
            100% { transform: translate(-15px, 15px) scale(0.9); opacity: 0.5; }
        }

        /* Wooden Signpost Overlays matching pond.jpg positions */
        .signpost-label {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 15;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
        }

        /* Left wooden sign on pond.jpg */
        #sign-left {
            left: 2.0%;
            top: 48.0%;
            width: 10.6%;
            height: 11.8%;
            transform: rotate(-6deg);
        }

        /* Right wooden sign on pond.jpg */
        #sign-right {
            right: 1.8%;
            top: 50.2%;
            width: 10.2%;
            height: 11.5%;
            transform: rotate(6.5deg);
        }

        .signpost-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 2.7vw, 2.5rem);
            color: #fff8e7;
            text-shadow: 
                0 2px 0 #4a2508,
                0 -1px 0 #4a2508,
                2px 0 0 #4a2508,
                -2px 0 0 #4a2508,
                0 4px 8px rgba(0,0,0,0.65);
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .sign-highlight {
            filter: drop-shadow(0 0 16px rgba(255, 238, 88, 0.95)) brightness(1.15);
            transform: scale(1.1) !important;
        }

        /* Frog Containers */
        .frog-zone {
            position: absolute;
            width: 24%;
            height: 33%;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: filter 0.25s ease, transform 0.25s ease;
        }

        #frog-left-zone {
            left: 9.5%;
            bottom: 8.5%;
        }

        #frog-right-zone {
            right: 9.5%;
            bottom: 8.5%;
        }

        .frog-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: frogIdle 3.4s ease-in-out infinite;
            transform-origin: center bottom;
        }

        #frog-right-zone .frog-wrapper {
            animation-delay: -1.7s;
        }

        .frog-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 12px 14px rgba(0, 20, 15, 0.55));
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        /* Hover / Drag Target Glow on Frog */
        .frog-zone.drag-over .frog-img {
            transform: scale(1.12) translateY(-6px);
            filter: drop-shadow(0 0 22px rgba(163, 230, 53, 0.95)) drop-shadow(0 12px 14px rgba(0, 20, 15, 0.55));
        }

        @keyframes frogIdle {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            50% { transform: translateY(-7px) scale(1.02, 0.98); }
        }

        /* Frog Eating Animation */
        .frog-eating {
            animation: frogEatJump 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        @keyframes frogEatJump {
            0% { transform: scale(1) translateY(0); }
            30% { transform: scale(1.25, 0.85) translateY(8px); }
            55% { transform: scale(0.92, 1.28) translateY(-32px); }
            80% { transform: scale(1.12, 0.92) translateY(4px); }
            100% { transform: scale(1) translateY(0); }
        }

        /* Frog Wrong Splash Disappear Animation */
        .frog-splashed {
            animation: frogSinkSplash 1.75s ease-in-out forwards !important;
        }

        @keyframes frogSinkSplash {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            18% { transform: translateY(-18px) scale(0.9, 1.15) rotate(-8deg); opacity: 1; }
            40% { transform: translateY(55px) scale(0.3, 0.5) rotate(12deg); opacity: 0; }
            78% { transform: translateY(55px) scale(0.3, 0.5); opacity: 0; }
            92% { transform: translateY(-10px) scale(1.08, 0.94); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Frog Tongue SVG Line */
        .frog-tongue {
            position: absolute;
            top: 28%;
            left: 50%;
            width: 14px;
            height: 0px;
            background: linear-gradient(to bottom, #ff4d6d, #ff758f);
            border-radius: 10px;
            transform-origin: top center;
            opacity: 0;
            z-index: 25;
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.6);
            pointer-events: none;
        }

        .frog-tongue::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: -4px;
            width: 22px;
            height: 16px;
            background: #ff4d6d;
            border-radius: 50%;
        }

        /* Water Splash Effect Container */
        .splash-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .splash-fx.active {
            opacity: 1;
        }

        .ripple-ring {
            position: absolute;
            bottom: 12%;
            width: 40%;
            height: 16%;
            border: 4px solid rgba(224, 247, 250, 0.9);
            border-radius: 50%;
            opacity: 0;
        }

        .splash-fx.active .ripple-1 {
            animation: rippleExpand 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-fx.active .ripple-2 {
            animation: rippleExpand 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards;
        }

        @keyframes rippleExpand {
            0% { transform: scale(0.3); opacity: 1; border-width: 6px; }
            100% { transform: scale(2.4); opacity: 0; border-width: 1px; }
        }

        .droplet {
            position: absolute;
            bottom: 22%;
            width: 14px;
            height: 20px;
            background: linear-gradient(180deg, #ffffff 0%, #67e8f9 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            box-shadow: 0 0 10px rgba(103, 232, 249, 0.8);
        }

        .splash-fx.active .droplet {
            animation: dropletArc 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes dropletArc {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            50% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 1; }
            100% { transform: translate(calc(var(--dx) * 1.5), 35px) scale(0.2); opacity: 0; }
        }

        /* Flying Bug / Clothing Item Entity */
        .bug-entity {
            position: absolute;
            left: 0;
            top: 0;
            width: 84px;
            height: 84px;
            margin-left: -42px;
            margin-top: -42px;
            z-index: 35;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            will-change: transform;
            transition: filter 0.2s ease;
        }

        .bug-entity:hover {
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.95));
        }

        /* State: Caught / Transformed into enlarged clothing card */
        .bug-entity.state-cloth {
            width: 138px;
            height: 152px;
            margin-left: -69px;
            margin-top: -76px;
            z-index: 50;
            cursor: grab;
        }

        /* State: Dragging (Turns back into bug with mini clothing tag!) */
        .bug-entity.state-dragging {
            width: 100px;
            height: 100px;
            margin-left: -50px;
            margin-top: -50px;
            z-index: 100;
            cursor: grabbing;
            filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 16px rgba(253, 224, 71, 0.95));
        }

        /* Bug Visual Wrapper */
        .bug-visual {
            position: relative;
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .bug-entity.state-cloth .bug-visual {
            transform: scale(0) rotate(180deg);
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }

        .bug-entity.state-dragging .bug-visual {
            transform: scale(1.18);
            opacity: 1;
        }

        /* Wing flapping animation */
        .wing-left {
            transform-origin: 50px 45px;
            animation: flapLeft 0.14s ease-in-out infinite alternate;
        }
        .wing-right {
            transform-origin: 50px 45px;
            animation: flapRight 0.14s ease-in-out infinite alternate;
        }

        @keyframes flapLeft {
            0% { transform: rotate(-18deg) scaleY(0.9); }
            100% { transform: rotate(22deg) scaleY(1.08); }
        }
        @keyframes flapRight {
            0% { transform: rotate(18deg) scaleY(0.9); }
            100% { transform: rotate(-22deg) scaleY(1.08); }
        }

        /* Clothing Card Visual (shown when bug is caught) */
        .cloth-card {
            position: absolute;
            width: 136px;
            height: 150px;
            background: radial-gradient(circle at 30% 25%, #ffffff 0%, #fef9c3 65%, #fde047 100%);
            border: 4px solid #ffffff;
            border-radius: 26px;
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.45),
                0 0 24px rgba(250, 204, 21, 0.85),
                inset 0 -4px 8px rgba(202, 138, 4, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px 8px 8px;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }

        .bug-entity.state-cloth .cloth-card {
            transform: scale(1.14);
            opacity: 1;
            pointer-events: auto;
            animation: clothPulse 2s ease-in-out infinite alternate;
        }

        @keyframes clothPulse {
            0% { transform: scale(1.1) translateY(0px); box-shadow: 0 12px 25px rgba(0,0,0,0.45), 0 0 20px rgba(250, 204, 21, 0.8); }
            100% { transform: scale(1.17) translateY(-5px); box-shadow: 0 18px 30px rgba(0,0,0,0.5), 0 0 32px rgba(250, 204, 21, 1); }
        }

        .cloth-svg-wrap {
            width: 82px;
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
        }

        .cloth-name-badge {
            background: #15803d;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            padding: 2px 12px;
            border-radius: 999px;
            letter-spacing: 0.4px;
            text-transform: lowercase;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* Sparkle burst particles when catching a bug */
        .sparkle-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 80;
            animation: particleBurst 0.65s ease-out forwards;
        }

        @keyframes particleBurst {
            0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* Confetti for Victory */
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 18px;
            top: -20px;
            z-index: 120;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0.8; }
        }

        /* Glossy 3D Game Buttons */
        .btn-game {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border: 3px solid #dcfce7;
            box-shadow: 0 6px 0 #14532d, 0 10px 20px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
        }
        .btn-game:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #14532d, 0 14px 24px rgba(0,0,0,0.45);
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #14532d, 0 4px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="viewport-wrapper">
    <div id="game-stage">
        
        <!-- Top HUD Bar (Clean controls & counter only, no hints) -->
        <div class="absolute top-3 right-4 flex items-center justify-end z-40 pointer-events-none">
            <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
                <!-- Progress Counter -->
                <div class="bg-emerald-950/80 backdrop-blur-md border-2 border-amber-400/60 rounded-2xl px-4 py-1.5 shadow-xl flex items-center gap-2">
                    <span class="text-xl">🪲</span>
                    <div class="flex items-baseline gap-1">
                        <span id="score-current" class="text-amber-300 font-bold text-lg sm:text-xl leading-none">0</span>
                        <span class="text-emerald-300 text-xs font-bold">/ 11</span>
                    </div>
                </div>

                <!-- Sound Toggle Button -->
                <button id="btn-sound" onclick="toggleMute()" title="Toggle Sound"
                    class="bg-emerald-900/85 hover:bg-emerald-800 border-2 border-emerald-400/50 text-white w-11 h-11 rounded-2xl shadow-lg flex items-center justify-center text-xl transition active:scale-95">
                    🔊
                </button>

                <!-- Reset Button -->
                <button onclick="resetGameWithClick()" title="Restart Game"
                    class="bg-amber-500/90 hover:bg-amber-400 border-2 border-amber-200 text-amber-950 font-bold px-3 h-11 rounded-2xl shadow-lg flex items-center gap-1.5 text-sm transition active:scale-95">
                    <span>🔄</span>
                </button>
            </div>
        </div>

        <!-- Ambient Fireflies Layer -->
        <div id="fireflies-layer" class="absolute inset-0 pointer-events-none"></div>

        <!-- LEFT WOODEN SIGNPOST ("It's") positioned directly over the left wooden post in pond.jpg -->
        <div id="sign-left" class="signpost-label">
            <span class="signpost-text">It's</span>
        </div>

        <!-- RIGHT WOODEN SIGNPOST ("They're") positioned directly over the right wooden post in pond.jpg -->
        <div id="sign-right" class="signpost-label">
            <span class="signpost-text">They're</span>
        </div>

        <!-- LEFT FROG (Frog 1 - Represents "It's") -->
        <div id="frog-left-zone" class="frog-zone" data-category="its" onclick="pokeFrog('left')">
            <div id="frog-left-wrapper" class="frog-wrapper">
                <div id="tongue-left" class="frog-tongue"></div>
                <img src="frog1.png" alt="Frog 1 - It's" class="frog-img"
                     onerror="this.src='https://placehold.co/400x400/22c55e/ffffff?text=Frog+1'"/>
            </div>
            <!-- Water Splash Effect for Left Frog -->
            <div id="splash-left" class="splash-fx">
                <div class="ripple-ring ripple-1"></div>
                <div class="ripple-ring ripple-2"></div>
                <div class="droplet" style="--dx: -55px; --dy: -75px;"></div>
                <div class="droplet" style="--dx: -25px; --dy: -95px;"></div>
                <div class="droplet" style="--dx: 20px; --dy: -90px;"></div>
                <div class="droplet" style="--dx: 55px; --dy: -70px;"></div>
                <div class="droplet" style="--dx: 0px; --dy: -110px;"></div>
            </div>
        </div>

        <!-- RIGHT FROG (Frog 2 - Represents "They're") -->
        <div id="frog-right-zone" class="frog-zone" data-category="theyre" onclick="pokeFrog('right')">
            <div id="frog-right-wrapper" class="frog-wrapper">
                <div id="tongue-right" class="frog-tongue"></div>
                <img src="frog2.png" alt="Frog 2 - They're" class="frog-img"
                     onerror="this.src='https://placehold.co/400x400/16a34a/ffffff?text=Frog+2'"/>
            </div>
            <!-- Water Splash Effect for Right Frog -->
            <div id="splash-right" class="splash-fx">
                <div class="ripple-ring ripple-1"></div>
                <div class="ripple-ring ripple-2"></div>
                <div class="droplet" style="--dx: -55px; --dy: -75px;"></div>
                <div class="droplet" style="--dx: -25px; --dy: -95px;"></div>
                <div class="droplet" style="--dx: 20px; --dy: -90px;"></div>
                <div class="droplet" style="--dx: 55px; --dy: -70px;"></div>
                <div class="droplet" style="--dx: 0px; --dy: -110px;"></div>
            </div>
        </div>

        <!-- Flying Bugs Interactive Layer -->
        <div id="bugs-layer" class="absolute inset-0"></div>

        <!-- Celebration / Well Done Modal -->
        <div id="victory-modal" class="fixed inset-0 z-[110] bg-black/65 backdrop-blur-sm hidden items-center justify-center p-4">
            <div class="bg-gradient-to-b from-emerald-800 via-emerald-900 to-teal-950 border-4 border-amber-300 rounded-3xl max-w-lg w-full p-6 sm:p-8 text-center shadow-[0_0_60px_rgba(250,204,21,0.5)] transform transition-all scale-95 animate-bounce-in relative overflow-hidden">
                <!-- Decorative Glow -->
                <div class="absolute -top-20 -left-20 w-44 h-44 bg-amber-400/20 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -bottom-20 -right-20 w-44 h-44 bg-emerald-400/20 rounded-full blur-2xl pointer-events-none"></div>

                <div class="flex justify-center items-center gap-4 mb-3">
                    <img src="frog1.png" alt="Frog 1" class="w-20 h-20 object-contain drop-shadow-lg animate-bounce" style="animation-duration: 1.8s;" />
                    <div class="text-5xl sm:text-6xl">👑</div>
                    <img src="frog2.png" alt="Frog 2" class="w-20 h-20 object-contain drop-shadow-lg animate-bounce" style="animation-duration: 1.8s; animation-delay: 0.3s;" />
                </div>

                <h2 class="text-4xl sm:text-5xl font-bold text-amber-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.6)] mb-6 tracking-wide">
                    Well Done!
                </h2>

                <button onclick="resetGameWithClick()" class="btn-game text-emerald-950 font-bold text-xl px-8 py-3.5 rounded-2xl cursor-pointer inline-flex items-center gap-2">
                    <span>🎉</span>
                    <span>Play Again</span>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    /**************************************************************
     * 1. WEB AUDIO SYNTHESIZER (No external audio files needed)
     **************************************************************/
    let audioCtx = null;
    let isMuted = false;

    function getAudioContext() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    function toggleMute() {
        isMuted = !isMuted;
        const btn = document.getElementById('btn-sound');
        btn.textContent = isMuted ? '🔇' : '🔊';
        if (!isMuted) playClickSound();
    }

    // Crisp UI click sound
    function playClickSound() {
        if (isMuted) return;
        try {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(650, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.18, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.065);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.07);
        } catch (e) {}
    }

    // Magical Pop sound when catching a bug -> transforms into clothing
    function playCatchTransformSound() {
        if (isMuted) return;
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            // Pop + ascending chime
            const notes = [523.25, 659.25, 783.99, 1046.5];
            notes.forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.045);
                gain.gain.setValueAtTime(0.2, now + idx * 0.045);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.18);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.045);
                osc.stop(now + idx * 0.045 + 0.19);
            });
        } catch (e) {}
    }

    // Funny Frog Ribbit + Gulp Eating Sound!
    function playFrogEatSound() {
        if (isMuted) return;
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            // Part 1: Fast tongue slurp / boing
            const slurpOsc = ctx.createOscillator();
            const slurpGain = ctx.createGain();
            slurpOsc.type = 'sine';
            slurpOsc.frequency.setValueAtTime(300, now);
            slurpOsc.frequency.exponentialRampToValueAtTime(980, now + 0.11);
            slurpOsc.frequency.exponentialRampToValueAtTime(220, now + 0.22);
            slurpGain.gain.setValueAtTime(0.28, now);
            slurpGain.gain.exponentialRampToValueAtTime(0.01, now + 0.23);
            slurpOsc.connect(slurpGain);
            slurpGain.connect(ctx.destination);
            slurpOsc.start(now);
            slurpOsc.stop(now + 0.24);

            // Part 2: Funny Croak "Rib-bit!" + Gulp
            const croakTimes = [0.22, 0.36];
            croakTimes.forEach((offset, i) => {
                const osc = ctx.createOscillator();
                const filter = ctx.createBiquadFilter();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                const startFreq = i === 0 ? 145 : 175;
                const endFreq = i === 0 ? 230 : 320;
                osc.frequency.setValueAtTime(startFreq, now + offset);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + offset + 0.11);

                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(650, now + offset);
                filter.Q.setValueAtTime(4, now + offset);

                gain.gain.setValueAtTime(0.32, now + offset);
                gain.gain.exponentialRampToValueAtTime(0.005, now + offset + 0.13);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now + offset);
                osc.stop(now + offset + 0.14);
            });
        } catch (e) {}
    }

    // Realistic & Comical Water Splash Sound when dropped on the wrong frog
    function playWaterSplashSound() {
        if (isMuted) return;
        try {
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            // 1. Descending "bloop/plop" into water
            const plopOsc = ctx.createOscillator();
            const plopGain = ctx.createGain();
            plopOsc.type = 'sine';
            plopOsc.frequency.setValueAtTime(420, now);
            plopOsc.frequency.exponentialRampToValueAtTime(95, now + 0.18);
            plopOsc.frequency.exponentialRampToValueAtTime(260, now + 0.32);
            plopGain.gain.setValueAtTime(0.35, now);
            plopGain.gain.exponentialRampToValueAtTime(0.005, now + 0.35);
            plopOsc.connect(plopGain);
            plopGain.connect(ctx.destination);
            plopOsc.start(now);
            plopOsc.stop(now + 0.36);

            // 2. Filtered White Noise burst for water splash & droplets
            const bufferSize = ctx.sampleRate * 0.75;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const whiteNoise = ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1100, now + 0.04);
            filter.frequency.exponentialRampToValueAtTime(380, now + 0.7);
            filter.Q.setValueAtTime(1.5, now);

            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.01, now);
            noiseGain.gain.linearRampToValueAtTime(0.42, now + 0.06);
            noiseGain.gain.exponentialRampToValueAtTime(0.005, now + 0.72);

            whiteNoise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            whiteNoise.start(now + 0.02);
            whiteNoise.stop(now + 0.75);
        } catch (e) {}
    }

                osc.start(now + note.t);

    /**************************************************************
     * 3. GAME STATE & PHYSICS LOOP
     **************************************************************/
    const stageEl = document.getElementById('game-stage');
    const bugsLayer = document.getElementById('bugs-layer');
    const scoreCurrentEl = document.getElementById('score-current');
    const victoryModal = document.getElementById('victory-modal');

    let bugs = [];
    let score = 0;
    let activeDragBug = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let animFrameId = null;

    // Create ambient background fireflies
    function initAmbientFireflies() {
        const layer = document.getElementById('fireflies-layer');
        layer.innerHTML = '';
        for (let i = 0; i < 18; i++) {
            const ff = document.createElement('div');
            ff.className = 'firefly';
            ff.style.left = `${8 + Math.random() * 84}%`;
            ff.style.top = `${10 + Math.random() * 75}%`;
            ff.style.animationDelay = `${-Math.random() * 6}s`;
            ff.style.animationDuration = `${4 + Math.random() * 4}s`;
            layer.appendChild(ff);
        }
    }

    // Initialize or Reset Game
    function initGame() {
        score = 0;
        scoreCurrentEl.textContent = '0';
        victoryModal.classList.add('hidden');
        victoryModal.classList.remove('flex');
        bugsLayer.innerHTML = '';
        bugs = [];
        activeDragBug = null;

        // Clean up any leftover confetti
        document.querySelectorAll('.confetti-piece').forEach(el => el.remove());

        const stageRect = stageEl.getBoundingClientRect();
        const w = stageRect.width || 1000;
        const h = stageRect.height || 562;

        // Shuffle items slightly for varied positions
        const shuffled = [...CLOTHING_ITEMS].sort(() => Math.random() - 0.5);

        shuffled.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'bug-entity state-flying';
            el.dataset.id = item.id;

            // Distribute bugs across upper & central pond area
            const cols = 4;
            const col = index % cols;
            const row = Math.floor(index / cols);
            const startX = w * (0.20 + col * 0.19 + (Math.random() * 0.08 - 0.04));
            const startY = h * (0.18 + row * 0.16 + (Math.random() * 0.07 - 0.035));

            // Speed & smooth wave parameters
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.15 + Math.random() * 0.85;

            el.innerHTML = `
                <!-- Bug Visual (shown while flying & while dragging) -->
                <div class="bug-visual">
                    ${createBugSVG(index)}
                </div>

                <!-- Enlarged Clothing Card (shown when caught/clicked - only picture and term) -->
                <div class="cloth-card">
                    <div class="cloth-svg-wrap">${item.svg}</div>
                    <div class="cloth-name-badge">${item.name}</div>
                </div>
            `;

            bugsLayer.appendChild(el);

            const bugObj = {
                id: item.id,
                item: item,
                el: el,
                state: 'flying', // 'flying' | 'cloth' | 'dragging' | 'eaten'
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                wavePhase: Math.random() * Math.PI * 2
            };

            // Attach pointer interaction
            setupBugInteraction(bugObj);
            bugs.push(bugObj);
            updateBugTransform(bugObj);
        });
    }

    function resetGameWithClick() {
        playClickSound();
        initGame();
    }

    // Update DOM position of a bug
    function updateBugTransform(bug) {
        if (bug.state === 'flying') {
            // Tilt slightly in flight direction
            const tilt = Math.max(-18, Math.min(18, bug.vx * 8));
            bug.el.style.transform = `translate3d(${bug.x}px, ${bug.y}px, 0) rotate(${tilt}deg)`;
        } else {
            bug.el.style.transform = `translate3d(${bug.x}px, ${bug.y}px, 0) rotate(0deg)`;
        }
    }

    // Main 60fps animation loop for flying bugs
    function gameLoop() {
        const stageRect = stageEl.getBoundingClientRect();
        const w = stageRect.width;
        const h = stageRect.height;

        // Keep flying bugs in the upper/center pond sky so they don't overlap the frogs at bottom corners
        const minX = w * 0.14;
        const maxX = w * 0.86;
        const minY = h * 0.14;
        const maxY = h * 0.62;

        bugs.forEach(bug => {
            if (bug.state === 'flying') {
                bug.wavePhase += 0.04;
                bug.x += bug.vx;
                bug.y += bug.vy + Math.sin(bug.wavePhase) * 0.45;

                // Smooth boundary bounce
                if (bug.x < minX) { bug.x = minX; bug.vx = Math.abs(bug.vx); }
                if (bug.x > maxX) { bug.x = maxX; bug.vx = -Math.abs(bug.vx); }
                if (bug.y < minY) { bug.y = minY; bug.vy = Math.abs(bug.vy); }
                if (bug.y > maxY) { bug.y = maxY; bug.vy = -Math.abs(bug.vy); }

                updateBugTransform(bug);
            }
        });

        animFrameId = requestAnimationFrame(gameLoop);
    }

    /**************************************************************
     * 4. CATCHING BUGS & DRAGGING CLOTHES TO FROGS
     **************************************************************/
    function setupBugInteraction(bug) {
        const el = bug.el;

        el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // CASE 1: Bug is flying -> Catch it! It stops and turns into enlarged clothing item
            if (bug.state === 'flying') {
                catchBugAndRevealCloth(bug);
                return;
            }

            // CASE 2: Bug is already a revealed clothing item -> Start dragging!
            // As requested: "When I start dragging it turns back into the bug."
            if (bug.state === 'cloth') {
                startDraggingBug(bug, e);
            }
        });
    }

    function catchBugAndRevealCloth(bug) {
        playCatchTransformSound();
        bug.state = 'cloth';
        bug.el.classList.remove('state-flying', 'state-dragging');
        bug.el.classList.add('state-cloth');

        // Keep within comfortable screen bounds when enlarged
        const stageRect = stageEl.getBoundingClientRect();
        bug.x = Math.max(85, Math.min(stageRect.width - 85, bug.x));
        bug.y = Math.max(100, Math.min(stageRect.height - 110, bug.y));
        updateBugTransform(bug);

        // Sparkle burst effect
        spawnSparkles(bug.x, bug.y, '#fde047');
    }

    function startDraggingBug(bug, e) {
        playDragBugMorphSound();
        activeDragBug = bug;
        bug.state = 'dragging';

        // Transforms back into the bug on drag start!
        bug.el.classList.remove('state-cloth', 'state-flying');
        bug.el.classList.add('state-dragging');

        const stageRect = stageEl.getBoundingClientRect();
        const pointerX = e.clientX - stageRect.left;
        const pointerY = e.clientY - stageRect.top;

        dragOffsetX = bug.x - pointerX;
        dragOffsetY = bug.y - pointerY;

        // Slightly center onto cursor for natural feel
        dragOffsetX *= 0.35;
        dragOffsetY *= 0.35;

        bug.x = pointerX + dragOffsetX;
        bug.y = pointerY + dragOffsetY;
        updateBugTransform(bug);
    }

    // Global pointer move & up listeners for smooth dragging
    window.addEventListener('pointermove', (e) => {
        if (!activeDragBug) return;
        e.preventDefault();

        const stageRect = stageEl.getBoundingClientRect();
        const pointerX = e.clientX - stageRect.left;
        const pointerY = e.clientY - stageRect.top;

        activeDragBug.x = Math.max(30, Math.min(stageRect.width - 30, pointerX + dragOffsetX));
        activeDragBug.y = Math.max(30, Math.min(stageRect.height - 30, pointerY + dragOffsetY));
        updateBugTransform(activeDragBug);

        // Highlight frog & signpost if hovering over a drop zone
        checkFrogHoverHighlight(e.clientX, e.clientY);
    }, { passive: false });

    window.addEventListener('pointerup', (e) => {
        if (!activeDragBug) return;
        const bug = activeDragBug;
        activeDragBug = null;

        clearFrogHoverHighlights();

        const targetFrogSide = detectDroppedFrog(e.clientX, e.clientY);
        if (targetFrogSide) {
            handleFrogFeedAttempt(bug, targetFrogSide);
        } else {
            // Not dropped on a frog -> return to enlarged clothing state so user can still see it or drag again
            playClickSound();
            bug.state = 'cloth';
            bug.el.classList.remove('state-dragging');
            bug.el.classList.add('state-cloth');
            updateBugTransform(bug);
        }
    });

    function detectDroppedFrog(clientX, clientY) {
        const leftZone = document.getElementById('frog-left-zone');
        const rightZone = document.getElementById('frog-right-zone');
        const leftSign = document.getElementById('sign-left');
        const rightSign = document.getElementById('sign-right');

        if (isPointNearElement(clientX, clientY, leftZone, 24) || isPointNearElement(clientX, clientY, leftSign, 15)) {
            return 'left';
        }
        if (isPointNearElement(clientX, clientY, rightZone, 24) || isPointNearElement(clientX, clientY, rightSign, 15)) {
            return 'right';
        }
        return null;
    }

    function isPointNearElement(cx, cy, el, pad = 0) {
        const r = el.getBoundingClientRect();
        return (
            cx >= r.left - pad &&
            cx <= r.right + pad &&
            cy >= r.top - pad &&
            cy <= r.bottom + pad
        );
    }

    function checkFrogHoverHighlight(clientX, clientY) {
        const side = detectDroppedFrog(clientX, clientY);
        const leftZone = document.getElementById('frog-left-zone');
        const rightZone = document.getElementById('frog-right-zone');
        const leftSign = document.getElementById('sign-left');
        const rightSign = document.getElementById('sign-right');

        leftZone.classList.toggle('drag-over', side === 'left');
        leftSign.classList.toggle('sign-highlight', side === 'left');
        rightZone.classList.toggle('drag-over', side === 'right');
        rightSign.classList.toggle('sign-highlight', side === 'right');
    }

    function clearFrogHoverHighlights() {
        document.getElementById('frog-left-zone').classList.remove('drag-over');
        document.getElementById('frog-right-zone').classList.remove('drag-over');
        document.getElementById('sign-left').classList.remove('sign-highlight');
        document.getElementById('sign-right').classList.remove('sign-highlight');
    }

    /**************************************************************
     * 5. FEEDING THE FROGS (CORRECT EAT VS WRONG SPLASH)
     **************************************************************/
    function handleFrogFeedAttempt(bug, side) {
        const expectedCategory = side === 'left' ? 'its' : 'theyre';
        const isCorrect = bug.item.category === expectedCategory;

        const frogZone = document.getElementById(`frog-${side}-zone`);
        const frogWrapper = document.getElementById(`frog-${side}-wrapper`);
        const stageRect = stageEl.getBoundingClientRect();
        const frogRect = frogZone.getBoundingClientRect();

        // Mouth target coordinates relative to stage
        const mouthX = (frogRect.left + frogRect.width * 0.5) - stageRect.left;
        const mouthY = (frogRect.top + frogRect.height * 0.36) - stageRect.top;

        if (isCorrect) {
            // CORRECT! Frog snaps tongue & eats the bug with a funny sound
            bug.state = 'eaten';
            playFrogEatSound();

            // Animate tongue snap
            const tongue = document.getElementById(`tongue-${side}`);
            tongue.style.transition = 'height 0.12s ease-out, opacity 0.05s';
            tongue.style.opacity = '1';
            tongue.style.height = '95px';
            setTimeout(() => {
                tongue.style.height = '0px';
                setTimeout(() => { tongue.style.opacity = '0'; }, 120);
            }, 130);

            // Pull bug swiftly into frog's mouth
            bug.el.style.transition = 'transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease';
            bug.el.style.transform = `translate3d(${mouthX}px, ${mouthY}px, 0) scale(0.15)`;
            bug.el.style.opacity = '0';

            // Frog excited jump/gulp animation
            frogWrapper.classList.remove('frog-eating');
            void frogWrapper.offsetWidth;
            frogWrapper.classList.add('frog-eating');
            setTimeout(() => frogWrapper.classList.remove('frog-eating'), 700);

            // Sparkles only (no hint/phrase popups)
            spawnSparkles(mouthX, mouthY, '#4ade80');

            setTimeout(() => {
                bug.el.remove();
            }, 250);

            // Update Score
            score++;
            scoreCurrentEl.textContent = score;

            if (score >= CLOTHING_ITEMS.length) {
                setTimeout(triggerVictoryCelebration, 750);
            }

        } else {
            // WRONG FROG! The frog disappears into the water making a splash sound!
            playWaterSplashSound();

            // Trigger Water Splash Ripples & Droplets
            const splashEl = document.getElementById(`splash-${side}`);
            splashEl.classList.remove('active');
            void splashEl.offsetWidth;
            splashEl.classList.add('active');

            // Frog sinks into pond with splash animation and pops back up after 1.7s
            frogWrapper.classList.remove('frog-splashed');
            void frogWrapper.offsetWidth;
            frogWrapper.classList.add('frog-splashed');

            setTimeout(() => {
                frogWrapper.classList.remove('frog-splashed');
                splashEl.classList.remove('active');
            }, 1750);

            // Return the bug to flying around in the sky so the player can catch/drag it again
            bug.state = 'flying';
            bug.el.classList.remove('state-dragging', 'state-cloth');
            bug.el.classList.add('state-flying');
            bug.y = Math.min(bug.y, stageRect.height * 0.42);
            bug.vy = -Math.abs(bug.vy);
            updateBugTransform(bug);
        }
    }

    // Fun interactive easter egg when clicking directly on a frog
    function pokeFrog(side) {
        playFrogEatSound();
        const wrapper = document.getElementById(`frog-${side}-wrapper`);
        wrapper.classList.remove('frog-eating');
        void wrapper.offsetWidth;
        wrapper.classList.add('frog-eating');
        setTimeout(() => wrapper.classList.remove('frog-eating'), 650);
    }

    /**************************************************************
     * 6. VISUAL EFFECTS (SPARKLES, FLOATING TEXT, VICTORY CONFETTI)
     **************************************************************/
    function spawnSparkles(x, y, color) {
        const colors = [color, '#ffffff', '#fde047', '#4ade80'];
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.className = 'sparkle-particle';
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.style.backgroundColor = colors[i % colors.length];
            p.style.boxShadow = `0 0 8px ${colors[i % colors.length]}`;

            const angle = (Math.PI * 2 * i) / 12;
            const dist = 35 + Math.random() * 45;
            p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

            stageEl.appendChild(p);
            setTimeout(() => p.remove(), 700);
        }
    }

    function triggerVictoryCelebration() {
        playVictoryFanfare();
        victoryModal.classList.remove('hidden');
        victoryModal.classList.add('flex');

        // Spawn colorful confetti across the screen
        const confettiColors = ['#fde047', '#4ade80', '#f472b6', '#38bdf8', '#fb923c', '#a855f7'];
        for (let i = 0; i < 70; i++) {
            const c = document.createElement('div');
            c.className = 'confetti-piece';
            c.style.left = `${Math.random() * 100}%`;
            c.style.backgroundColor = confettiColors[i % confettiColors.length];
            c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
            c.style.animationDuration = `${2.2 + Math.random() * 2.3}s`;
            c.style.animationDelay = `${Math.random() * 0.8}s`;
            stageEl.appendChild(c);
        }
    }

    // Start everything on window load
    window.onload = function () {
        initAmbientFireflies();
        initGame();
        gameLoop();
    };
</script>
